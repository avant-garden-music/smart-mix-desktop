[workspace]
resolver = "2"
members = [
    "crates/sm-model",
    "crates/sm-core",
    "crates/sm-db",
    "crates/sm-library",
    "crates/sm-audio",
    "crates/sm-export",
    "crates/sm-i18n",
    "crates/sm-app",
    "crates/sm-usb",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "LicenseRef-Proprietary"
repository = "https://github.com/avant-garden-music/smart-mix-desktop"
authors = ["Avant Garden Music"]

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rayon = "1.10"
rustfft = "6.2"
symphonia = { version = "0.5.4", features = ["mp3", "flac", "wav", "ogg", "vorbis", "aac", "isomp4", "alac", "aiff", "pcm"] }
rusqlite = { version = "0.31", features = ["bundled"] }
cpal = "0.15"
lofty = "0.18"
rfd = "0.13"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = { version = "0.27", features = ["wgpu"] }
egui = "0.27"
egui_extras = "0.27"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ort = { version = "=2.0.0-rc.9", features = ["download-binaries"] }

sm-model = { path = "crates/sm-model" }
sm-core = { path = "crates/sm-core" }
sm-db = { path = "crates/sm-db" }
sm-library = { path = "crates/sm-library" }
sm-audio = { path = "crates/sm-audio" }
sm-export = { path = "crates/sm-export" }
sm-i18n = { path = "crates/sm-i18n" }
sm-usb = { path = "crates/sm-usb" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
